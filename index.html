    <header>
      <h1>Benjamin Missbach</h1>
      <p>I design and run research funding programmes, currently at the <a href="https://wwtf.at/">Vienna Science and Technology Fund</a> (WWTF), and I gravitate towards the fields that get left out. For the past three years that has been ME/CFS. All opinions on this site are my own and don't represent WWTF or any other organisation I work with.</p>
      <p>At WWTF I managed 13 calls worth roughly &euro;30m in the last 5 years. I'm especially interested in how grants can be allocated cost-effectively, for scientific and societal value. I review international mobility applications for the <a href="https://www.wuebben-stiftung-wissenschaft.org/begutachtung">W&uuml;bben Foundation</a>, advise the <a href="https://vector-stiftung.de/projekte/forschungsbeirat/">Vector Foundation</a> as a member of its Research Board, and support <a href="https://openknowledgemaps.org/">Open Knowledge Maps</a> in democratising access to scientific literature.</p>
      <p>I build funding structures for neglected areas of biomedical research, combining hard competition, cooperation and creativity to get the best ideas out.</p>
      <p>Several threads came together in 2023, when I first encountered ME/CFS and the diseases around it, and saw how little scientific attention they had attracted. Since then, with <a href="https://www.weandmecfs.org/weme-projects/">WE&amp;ME</a>, we have built most of Austria's ME/CFS research funding: roughly &euro;3m in three years for <a href="https://science.apa.at/power-search/15245561985977369888">projects, people and infrastructure</a>.</p>
      <p>In ME/CFS funding, patients and patient advocates help design calls, review proposals and decide alongside academics. We work closely with the <a href="https://s4me.info">Science for ME</a> community.</p>
    </header>
    <section>
      <h2>Track record</h2>
      <article>
        <h3>2026&ndash;present: Expert panel, international mobility, <a href="https://www.wuebben-stiftung-wissenschaft.org/begutachtung">W&uuml;bben Foundation</a></h3>
        <p>I review onboarding and dual-career provisions in the foundation's professorship programmes. The <a href="https://www.wuebben-stiftung-wissenschaft.org/foerderprogramme">funding programmes</a> support newly appointed professors in building their groups and making the move to a new institution work.</p>
      </article>
      <article>
        <h3>2026&ndash;present: Research Board, <a href="https://vector-stiftung.de/projekte/forschungsbeirat/">Vector Foundation</a></h3>
        <p>For the foundation's research calls I assess proposals and draft funding recommendations, with a focus on <a href="https://vector-stiftung.de/forschung/">early-career researchers and environmental innovation</a>.</p>
      </article>
      <article>
        <h3>2021&ndash;present: Programme Manager, <a href="https://wwtf.at/">Vienna Science and Technology Fund</a> (WWTF)</h3>
        <p>Environmental Systems Research, Computer Science and ME/CFS: 13 calls worth roughly &euro;30m in five years, which I run from call design through international review to contract. As a boutique funder, our involvement does not end with the funding decision: we accompany the project teams throughout the funding period and fund proactively where a field needs it.</p>
        <p>I built the <a href="https://www.linkedin.com/newsletters/vienna-research-radar-7459820984167059456/">Vienna Research Radar</a>, a data pipeline and curated newsletter on the signal in Vienna's research ecosystem: new papers, new funding, new questions, every two weeks.</p>
      </article>
      <article>
        <h3>2017&ndash;2020: Project lead, <a href="https://lbg.ac.at/?lang=en">Ludwig Boltzmann Gesellschaft</a> Open Innovation in Science Center</h3>
        <p>I developed methods for opening up research: <a href="https://elephantinthelab.org/doing-open-innovation-a-practical-example/">crowdsourcing questions</a> with patients and the public, prioritisation processes, topic setting in health and medicine. Along the way I conceptualised and secured &euro;4m in funding for <a href="https://show.lbg.ac.at/?lang=en">SHoW</a>, the Ludwig Boltzmann Gesellschaft research group on non-healing wounds. With the Ludwig Boltzmann Institute of Fundamental and Human Rights I helped conceptualise a large crowdfunding project, <a href="https://www.startnext.com/atlas-of-torture/mehr-infos">Atlas of Torture</a>. With colleagues I co-created a patient and public involvement and engagement <a href="https://pubmed.ncbi.nlm.nih.gov/32566249/">'how to' guide for researchers</a>.</p>
      </article>
      <article>
        <h3>2012&ndash;2017: PhD, Nutritional Sciences, University of Vienna, and a little bit of postdoc time</h3>
        <p>Behavioural nutrition and public health: how sensory, cognitive and situational cues shape what people eat. Research stays at Cornell University and the German Institute of Human Nutrition, Potsdam.</p>
        <p>Alongside this, I ran systematic reviews and meta-analyses on diet and chronic disease risk with <a href="https://scholar.google.com/citations?user=9hQ4jTQAAAAJ&amp;hl=de">Lukas Schwingshackl</a>, including Mediterranean diet and diabetes risk in <a href="https://www.cambridge.org/core/journals/public-health-nutrition/article/adherence-to-a-mediterranean-diet-and-risk-of-diabetes-a-systematic-review-and-metaanalysis/39DAAE3F1BFD53B5A1123DBFBE40D3E1">Public Health Nutrition</a> and <a href="https://link.springer.com/article/10.1007/s00125-014-3303-z">Diabetologia</a>. My earlier work challenged the diagnostic criteria for orthorexia nervosa and the prevalence estimates built on them (<a href="https://doi.org/10.1016/j.appet.2016.07.010">Appetite</a>, <a href="https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0135772">PLOS ONE</a>, <a href="https://link.springer.com/article/10.1007/S40519-018-0606-y">Eating and Weight Disorders</a>).</p>
        <p><a href="https://scholar.google.com/citations?user=0aAA5DcAAAAJ&amp;hl=en">Publications, and the declining citation count that came with leaving academia.</a></p>
      </article>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

wtf.github.io/social-preview.jpg\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"theme-color\" content=\"#FFFFFF\">\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@type\":\"Person\",\"name\":\"Benjamin Missbach\",\"url\":\"https://benwwtf.github.io/\",\"image\":\"https://benwwtf.github.io/social-preview.jpg\",\"jobTitle\":\"Programme Manager\",\"worksFor\":{\"@type\":\"Organization\",\"name\":\"Vienna Science and Technology Fund (WWTF)\",\"url\":\"https://wwtf.at/\"},\"email\":\"mailto:hello@missbach.eu\",\"sameAs\":[\"https://scholar.google.com/citations?user=0aAA5DcAAAAJ&hl=en\",\"https://orcid.org/0000-0002-8513-6382\",\"https://bsky.app/profile/bbach.bsky.social\",\"https://github.com/BenWWTF\",\"https://www.linkedin.com/in/missbach/\"],\"alumniOf\":{\"@type\":\"CollegeOrUniversity\",\"name\":\"University of Vienna\"}}<\u002Fscript>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<style>/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"7003f0b7-cf24-4b67-9359-fcfa0db8fecf\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: italic;\n  font-weight: 400;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"d22c295a-d3cb-4787-b457-3ad7ca3ec20e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: italic;\n  font-weight: 400 , U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"8e519b42-902e-4c09-a387-eada72f4ace6\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"c6458bd3-48d6-4086-a86d-74b55b79f4d4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"78f6f1a2-a35b-420f-875a-bd128e70bdf5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"8ca77423-f5c6-41e8-9daf-9fc3d9c2e8a2\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #FFFFFF; }\n  a { color: #111111; }\n  a:hover { color: #111111; }\n  summary::-webkit-details-marker { display: none; }\n  summary::marker { content: \"\"; }\n  ::selection { background: #D8F252; }\n  .rail::-webkit-scrollbar { display: none; }\n  html { scroll-behavior: smooth; }\n  img, image-slot { max-width: 100%; }\n  image-slot::part(image) { touch-action: pan-y; }\n  a { overflow-wrap: anywhere; }\n  @media (max-width: 760px) {\n    [data-flip] { text-align: left; align-self: stretch; }\n  }\n  [data-impressum-wrap]:hover [data-impressum-pop],\n  [data-impressum-wrap]:focus-within [data-impressum-pop] { opacity: 1 !important; visibility: visible !important; transform: translateY(0) !important; }\n  @media (hover: none) {\n    footer a { padding-top: 14px; padding-bottom: 14px; }\n    [data-impressum-wrap] > span { padding-top: 14px; padding-bottom: 14px; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"background:#FFFFFF;color:#111111;font-family:Archivo,system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased\">\n  <div style=\"max-width:1520px;margin:0 auto;padding:0 clamp(24px,5vw,72px)\">\n\n\n    <main>\n    <header id=\"top\" style=\"padding:clamp(48px,6vw,88px) 0 0\">\n      <h1 style=\"font-weight:300;font-size:clamp(44px,12.4vw,186px);line-height:0.9;letter-spacing:-0.052em;margin:0;max-width:17ch\">Benjamin<br>Missbach<\u002Fh1>\n      <p style=\"font-weight:300;font-size:clamp(21px,3.4vw,50px);line-height:1.3;letter-spacing:-0.026em;margin:clamp(32px,5vw,64px) 0 0;text-wrap:pretty\">I design and run research funding programmes, currently at the <a href=\"https://wwtf.at/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #111111;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Vienna Science and Technology Fund<\u002Fa> (WWTF), and I gravitate towards the fields that get left out. For the past three years that has been ME/CFS. All opinions on this site are my own and don't represent WWTF or any other organisation I work with.<\u002Fp>\n\n      <div style=\"margin:clamp(36px,4.5vw,64px) 0 0;display:flex;justify-content:flex-end\">\n        <div style=\"width:min(100%,620px);position:relative\">\n          <div style=\"position:absolute;left:18px;top:18px;right:-18px;bottom:-18px;background:#D8F252;z-index:0\"><\u002Fdiv>\n          <image-slot id=\"site-portrait\" shape=\"rect\" fit=\"cover\" src=\"61e686dc-114e-40a7-814c-c937dd31ca74\" style=\"width:100%;height:auto;aspect-ratio:3/2;position:relative;z-index:1\" placeholder=\"Portrait, wide crop\" role=\"img\" aria-label=\"Benjamin Missbach mid-conversation, gesturing while holding a laptop\"><\u002Fimage-slot>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:clamp(96px,15vw,240px) 0 clamp(64px,9vw,140px)\">\n\n        <div style=\"display:flex;flex-direction:column;gap:clamp(72px,11vw,176px)\">\n          <p style=\"font-weight:300;line-height:1.24;letter-spacing:-0.026em;margin:0;text-wrap:pretty;font-size:clamp(23px,3.4vw,54px);max-width:40ch;align-self:flex-start\">At WWTF I managed 13 calls worth roughly €30m in the last 5 years. I'm especially interested in how grants can be allocated cost-effectively, for scientific and societal value. I review international mobility applications for the <a href=\"https://www.wuebben-stiftung-wissenschaft.org/begutachtung\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Wübben Foundation<\u002Fa>, advise the <a href=\"https://vector-stiftung.de/projekte/forschungsbeirat/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Vector Foundation<\u002Fa> as a member of its Research Board, and support <a href=\"https://openknowledgemaps.org/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Open Knowledge Maps<\u002Fa> in democratising access to scientific literature.<\u002Fp>\n\n          <p style=\"font-weight:300;line-height:1.16;letter-spacing:-0.034em;margin:0;text-wrap:pretty;font-size:clamp(25px,4.2vw,66px);max-width:22ch;align-self:flex-end;text-align:right\" data-flip=\"\">I build funding structures for neglected areas of biomedical research, combining hard competition, cooperation and creativity to get the best ideas out.<\u002Fp>\n\n          <p style=\"font-weight:300;line-height:1.2;letter-spacing:-0.03em;margin:0;text-wrap:pretty;font-size:clamp(23px,3.3vw,52px);max-width:40ch;align-self:flex-start\">Several threads came together in 2023, when I first encountered ME/CFS and the diseases around it, and saw how little scientific attention they had attracted. Since then, with <a href=\"https://www.weandmecfs.org/weme-projects/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #111111;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">WE&amp;ME<\u002Fa>, we have built most of Austria's ME/CFS research funding: roughly €3m in three years for <a href=\"https://science.apa.at/power-search/15245561985977369888\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">projects, people and infrastructure<\u002Fa>.<\u002Fp>\n\n          <p style=\"font-weight:300;line-height:1.16;letter-spacing:-0.034em;margin:0;text-wrap:pretty;font-size:clamp(25px,4.2vw,66px);max-width:22ch;align-self:flex-end;text-align:right\" data-flip=\"\">In ME/CFS funding, patients and patient advocates help design calls, review proposals and decide alongside academics. We work closely with the <a href=\"https://s4me.info\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Science for ME<\u002Fa> community.<\u002Fp>\n\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <section id=\"cv\" style=\"padding:clamp(40px,5vw,72px) 0 clamp(72px,10vw,160px)\">\n      <h2 style=\"font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;color:#5F5F5F;margin-bottom:clamp(24px,3vw,40px)\">Track record<\u002Fh2>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,4vw,72px);align-items:flex-start;padding:clamp(26px,3.4vw,48px) 0;border-top:1px solid #111111\">\n        <div style=\"flex:1 1 250px;min-width:0\">\n          <div style=\"font-size:clamp(13px,1vw,15px);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F\">2026–present<\u002Fdiv>\n          <h3 style=\"font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.16;letter-spacing:-0.026em;margin-top:12px;max-width:22ch\">Expert panel, international mobility, <a href=\"https://www.wuebben-stiftung-wissenschaft.org/begutachtung\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Wübben Foundation<\u002Fa><\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">I review onboarding and dual-career provisions in the foundation's professorship programmes. The <a href=\"https://www.wuebben-stiftung-wissenschaft.org/foerderprogramme\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">funding programmes<\u002Fa> support newly appointed professors in building their groups and making the move to a new institution work.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,4vw,72px);align-items:flex-start;padding:clamp(26px,3.4vw,48px) 0;border-top:1px solid #E8E8E8\">\n        <div style=\"flex:1 1 250px;min-width:0\">\n          <div style=\"font-size:clamp(13px,1vw,15px);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F\">2026–present<\u002Fdiv>\n          <h3 style=\"font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.16;letter-spacing:-0.026em;margin-top:12px;max-width:22ch\">Research Board, <a href=\"https://vector-stiftung.de/projekte/forschungsbeirat/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Vector Foundation<\u002Fa><\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">For the foundation's research calls I assess proposals and draft funding recommendations, with a focus on <a href=\"https://vector-stiftung.de/forschung/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">early-career researchers and environmental innovation<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,4vw,72px);align-items:flex-start;padding:clamp(26px,3.4vw,48px) 0;border-top:1px solid #E8E8E8\">\n        <div style=\"flex:1 1 250px;min-width:0\">\n          <div style=\"font-size:clamp(13px,1vw,15px);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F\">2021–present<\u002Fdiv>\n          <h3 style=\"font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.16;letter-spacing:-0.026em;margin-top:12px;max-width:22ch\">Programme Manager, <a href=\"https://wwtf.at/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Vienna Science and Technology Fund<\u002Fa> (WWTF)<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">Environmental Systems Research, Computer Science and ME/CFS: 13 calls worth roughly €30m in five years, which I run from call design through international review to contract. As a boutique funder, our involvement does not end with the funding decision: we accompany the project teams throughout the funding period and fund proactively where a field needs it.<\u002Fp>\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">I built the <a href=\"https://www.linkedin.com/newsletters/vienna-research-radar-7459820984167059456/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Vienna Research Radar<\u002Fa>, a data pipeline and curated newsletter on the signal in Vienna's research ecosystem: new papers, new funding, new questions, every two weeks.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,4vw,72px);align-items:flex-start;padding:clamp(26px,3.4vw,48px) 0;border-top:1px solid #E8E8E8\">\n        <div style=\"flex:1 1 250px;min-width:0\">\n          <div style=\"font-size:clamp(13px,1vw,15px);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F\">2017–2020<\u002Fdiv>\n          <h3 style=\"font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.16;letter-spacing:-0.026em;margin-top:12px;max-width:22ch\">Project lead, <a href=\"https://lbg.ac.at/?lang=en\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Ludwig Boltzmann Gesellschaft<\u002Fa> Open Innovation in Science Center<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">I developed methods for opening up research: <a href=\"https://elephantinthelab.org/doing-open-innovation-a-practical-example/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">crowdsourcing questions<\u002Fa> with patients and the public, prioritisation processes, topic setting in health and medicine. Along the way I conceptualised and secured €4m in funding for <a href=\"https://show.lbg.ac.at/?lang=en\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">SHoW<\u002Fa>, the Ludwig Boltzmann Gesellschaft research group on non-healing wounds. With the Ludwig Boltzmann Institute of Fundamental and Human Rights I helped conceptualise a large crowdfunding project, <a href=\"https://www.startnext.com/atlas-of-torture/mehr-infos\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Atlas of Torture<\u002Fa>. With colleagues I co-created a patient and public involvement and engagement <a href=\"https://pubmed.ncbi.nlm.nih.gov/32566249/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">'how to' guide for researchers<\u002Fa>.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:clamp(14px,4vw,72px);align-items:flex-start;padding:clamp(26px,3.4vw,48px) 0;border-top:1px solid #E8E8E8\">\n        <div style=\"flex:1 1 250px;min-width:0\">\n          <div style=\"font-size:clamp(13px,1vw,15px);font-weight:500;letter-spacing:0.16em;text-transform:uppercase;color:#5F5F5F\">2012–2017<\u002Fdiv>\n          <h3 style=\"font-weight:400;font-size:clamp(20px,2.2vw,32px);line-height:1.16;letter-spacing:-0.026em;margin-top:12px;max-width:22ch\">PhD, Nutritional Sciences, University of Vienna, and a little bit of postdoc time<\u002Fh3>\n        <\u002Fdiv>\n        <div style=\"flex:2 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">Behavioural nutrition and public health: how sensory, cognitive and situational cues shape what people eat. Research stays at Cornell University and the German Institute of Human Nutrition, Potsdam.<\u002Fp>\n          <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\">Alongside this, I ran systematic reviews and meta-analyses on diet and chronic disease risk with <a href=\"https://scholar.google.com/citations?user=9hQ4jTQAAAAJ&amp;hl=de\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Lukas Schwingshackl<\u002Fa>, including Mediterranean diet and diabetes risk in <a href=\"https://www.cambridge.org/core/journals/public-health-nutrition/article/adherence-to-a-mediterranean-diet-and-risk-of-diabetes-a-systematic-review-and-metaanalysis/39DAAE3F1BFD53B5A1123DBFBE40D3E1\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Public Health Nutrition<\u002Fa> and <a href=\"https://link.springer.com/article/10.1007/s00125-014-3303-z\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Diabetologia<\u002Fa>. My earlier work challenged the diagnostic criteria for orthorexia nervosa and the prevalence estimates built on them (<a href=\"https://doi.org/10.1016/j.appet.2016.07.010\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Appetite<\u002Fa>, <a href=\"https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0135772\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">PLOS ONE<\u002Fa>, <a href=\"https://link.springer.com/article/10.1007/S40519-018-0606-y\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Eating and Weight Disorders<\u002Fa>).<\u002Fp>\n            <p style=\"font-size:clamp(16px,1.25vw,19px);line-height:1.68;color:#333333;margin:0 0 0;max-width:64ch\"><a href=\"https://scholar.google.com/citations?user=0aAA5DcAAAAJ&amp;hl=en\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Publications, and the declining citation count that came with leaving academia.<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <div style=\"height:1px;background:#111111\"><\u002Fdiv>\n    <\u002Fmain>\n\n    <footer id=\"contact\" style=\"padding:clamp(40px,6vw,72px) 0 clamp(48px,7vw,96px);display:flex;flex-wrap:wrap;gap:clamp(20px,4vw,48px);align-items:baseline;justify-content:space-between\">\n      <div style=\"position:relative;display:flex;flex-wrap:wrap;gap:clamp(14px,3vw,40px) clamp(18px,3vw,40px);font-size:clamp(16px,1.2vw,18px);font-weight:500;letter-spacing:0.01em\">\n        <a href=\"mailto:hello@missbach.eu\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #111111;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">hello@missbach.eu<\u002Fa>\n        <a href=\"https://scholar.google.com/citations?user=0aAA5DcAAAAJ&amp;hl=en\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Google Scholar<\u002Fa>\n        <a href=\"https://orcid.org/0000-0002-8513-6382\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">ORCID<\u002Fa>\n        <a href=\"https://bsky.app/profile/bbach.bsky.social\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Bluesky<\u002Fa>\n        <a href=\"https://github.com/BenWWTF\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">GitHub<\u002Fa>\n        <a href=\"https://www.linkedin.com/in/missbach/\" style=\"color:#111111;text-decoration:none;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">LinkedIn<\u002Fa>\n        <div data-impressum-wrap=\"\" style=\"display:inline-flex\">\n          <span tabindex=\"0\" role=\"button\" aria-describedby=\"impressum-text\" style=\"font-size:inherit;font-weight:500;letter-spacing:0.01em;color:#111111;cursor:help;display:inline-block;border-bottom:1px solid #E8E8E8;padding-bottom:4px;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">Impressum<\u002Fspan>\n          <div data-impressum-pop=\"\" id=\"impressum-text\" style=\"position:absolute;left:0;right:auto;bottom:calc(100% + 14px);box-sizing:border-box;width:auto;max-width:min(440px,100%);background:#FFFFFF;border:1px solid #111111;padding:clamp(18px,2vw,24px);font-size:14px;line-height:1.6;color:#5F5F5F;text-align:left;z-index:20;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity 220ms ease,transform 220ms ease,visibility 220ms ease\">\n            <p style=\"margin:0\">Media owner, publisher and responsible for content: Benjamin Missbach, Eberlgasse 6/21, 1020 Vienna, Austria. Contact: <a href=\"mailto:hello@missbach.eu\" style=\"color:#5F5F5F;text-decoration:none;border-bottom:1px solid #E8E8E8;transition:color 260ms ease,border-color 260ms ease,background-color 260ms ease,box-shadow 260ms ease\" style-hover=\"color:#111111;border-color:#111111;background-color:#EFF7C4;box-shadow:0 0 0 3px #EFF7C4\">hello@missbach.eu<\u002Fa>.<\u002Fp>\n            <p style=\"margin:12px 0 0\">Editorial line and purpose: a personal website with information about the media owner's professional work. All content reflects the personal views of the media owner only.<\u002Fp>\n            <p style=\"margin:12px 0 0\">Disclosure pursuant to § 25 of the Austrian Media Act (Mediengesetz). Despite careful review, no liability is accepted for the accuracy or completeness of the content; the operators of linked sites are solely responsible for their own content.<\u002Fp>\n          <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Ffooter>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n    const root = this.el || document;\n    const items = [];\n    root.querySelectorAll(\"p, #cv > div\").forEach(el => {\n      if (el.closest(\"details\") || el.closest(\"[data-impressum-pop]\") || el.tagName === \"A\") return;\n      const r = el.getBoundingClientRect();\n      if (r.height > 0) items.push(el);\n    });\n    items.forEach(el => {\n      el.style.opacity = \"0\";\n      el.style.transform = \"translateY(14px)\";\n      el.style.transition = \"opacity 700ms cubic-bezier(.2,.6,.2,1), transform 700ms cubic-bezier(.2,.6,.2,1)\";\n    });\n    const reveal = el => {\n      el.style.opacity = \"1\";\n      el.style.transform = \"none\";\n      io.unobserve(el);\n    };\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => { if (e.isIntersecting) reveal(e.target); });\n      sweep();\n    }, { rootMargin: \"0px 0px -12% 0px\", threshold: 0.05 });\n    const sweep = () => {\n      items.forEach(el => {\n        if (el.style.opacity !== \"0\") return;\n        if (el.getBoundingClientRect().top < window.innerHeight) reveal(el);\n      });\n    };\n    items.forEach(el => io.observe(el));\n    root.querySelectorAll(\"details\").forEach(d => d.addEventListener(\"toggle\", () => sweep()));\n    let queued = false;\n    this.onScroll = () => {\n      if (queued) return;\n      queued = true;\n      requestAnimationFrame(() => { queued = false; sweep(); });\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    window.addEventListener(\"resize\", this.onScroll);\n    window.addEventListener(\"load\", this.onScroll);\n    requestAnimationFrame(sweep);\n    this.io = io;\n  }\n\n  componentWillUnmount() {\n    if (this.io) this.io.disconnect();\n    if (this.onScroll) {\n      window.removeEventListener(\"scroll\", this.onScroll);\n      window.removeEventListener(\"resize\", this.onScroll);\n      window.removeEventListener(\"load\", this.onScroll);\n    }\n  }\n\n  renderVals() {\n    return {\n      available: true\n    };\n  }}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
